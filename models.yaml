# LiteLLM Model Registry — Phase 1
# All LLM calls route through LLMClient, which reads this file at startup.
# To add a new model: append an entry below and restart the server.

models:
  - model_name: gpt-4o
    litellm_params:
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      cost_per_1k_input_tokens: 0.005
      cost_per_1k_output_tokens: 0.015
      context_window_tokens: 128000
      supports_vision: true
      tier: enterprise

  - model_name: claude-3-5-sonnet
