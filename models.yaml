# Phase 6: HNSW index parameters for DenseIndex
# Override these to tune recall vs. speed trade-offs.
hnsw_index:
  M: 16                   # Bi-directional links per node (higher = better recall, more memory)
  ef_construction: 200    # Candidate list size during build (higher = better recall, slower build)
  ef_search: 64           # Candidate list size during query (higher = better recall, slower query)
