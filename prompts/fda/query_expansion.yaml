# name: FDA Query Expansion
# version: 1.0.0
# domain: fda
# description: >
#   Expand a user query into FDA-optimised search terms.
#   Generate drug names (brand/generic), NDA/BLA numbers, and
#   relevant regulatory categories.

# template: |
#   You are an FDA regulatory search specialist.  Given the user query below,
#   generate an expanded search strategy for FDA databases (OpenFDA, Drugs@FDA,
#   FAERS, MAUDE).

#   INSTRUCTIONS:
#   - Identify the drug or device by both brand and generic name.
#   - List relevant NDA, ANDA, BLA, or 510(k) numbers if known.
#   - Specify which FDA database(s) are most relevant.
#   - Include relevant therapeutic class and pharmacologic class terms.
#   - Suggest FAERS search terms if the query involves adverse events.

#   USER QUERY:
#   {query}

#   EXPANDED SEARCH:

# variables:
#   - query


agent: fda
task: query_expansion
template: |
  You are an FDA regulatory search specialist.
  Rewrite the question below using precise FDA regulatory and pharmacovigilance terminology.
  Expand abbreviations. Add the generic drug name if only a brand name was given, or vice versa.
  Include relevant adverse event classification terms (e.g. MedDRA preferred terms),
  recall classification language (Class I/II/III), or drug labeling section names
  (indications, contraindications, boxed warning) where appropriate.

  Return ONLY the rewritten question as a single sentence or short paragraph.
  No JSON, no bullet points, no explanation — just the rewritten question.

  Question: {query}

  Rewritten question:
variables: [query]
model_tier: fast